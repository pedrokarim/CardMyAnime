version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: cardmyanime-postgres
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-cardmyanime}
      - POSTGRES_USER=${POSTGRES_USER:-cardmyanime}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-cardmyanime123}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cardmyanime} -d ${POSTGRES_DB:-cardmyanime}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - cardmyanime-network

  cardmyanime:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cardmyanime-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-cardmyanime}:${POSTGRES_PASSWORD:-cardmyanime123}@postgres:5432/${POSTGRES_DB:-cardmyanime}?schema=public
      - DIRECT_URL=postgresql://${POSTGRES_USER:-cardmyanime}:${POSTGRES_PASSWORD:-cardmyanime123}@postgres:5432/${POSTGRES_DB:-cardmyanime}?schema=public
      - ASCENCIA_ISSUER=${ASCENCIA_ISSUER}
      - ASCENCIA_CLIENT_ID=${ASCENCIA_CLIENT_ID}
      - ASCENCIA_CLIENT_SECRET=${ASCENCIA_CLIENT_SECRET}
      - ASCENCIA_SESSION_SECRET=${ASCENCIA_SESSION_SECRET}
      - NEXT_PUBLIC_ASCENCIA_ISSUER=${NEXT_PUBLIC_ASCENCIA_ISSUER}
      - NEXT_PUBLIC_ASCENCIA_CLIENT_ID=${NEXT_PUBLIC_ASCENCIA_CLIENT_ID}
      - NEXT_PUBLIC_ASCENCIA_REDIRECT_URI=${NEXT_PUBLIC_ASCENCIA_REDIRECT_URI}
    env_file:
      - .env
    # Configuration pour la santé de l'application
    # Sonde avec node plutôt que wget : l'image standalone n'embarque pas wget,
    # la sonde échouait donc systématiquement ("executable file not found") et
    # le conteneur restait marqué unhealthy en permanence, alors que
    # /api/health répondait bien. node est déjà là, ça n'ajoute aucun poids.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Limites de ressources
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    # Volumes pour les logs uniquement
    volumes:
      - ./logs:/app/logs
      # Jaquettes du fond de la page d'accueil. Hors image et hors git : elles
      # sont regenerees par un cron mensuel et doivent survivre aux deploiements,
      # sinon chaque reconstruction repartirait d'un dossier vide.
      - ./covers:/app/public/covers
    # Réseau
    networks:
      - cardmyanime-network

networks:
  cardmyanime-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
